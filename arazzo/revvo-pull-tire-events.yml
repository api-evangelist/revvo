arazzo: 1.0.1
info:
  title: Pull tire events for a fleet
  version: 1.0.0
  summary: Authenticate and read tire events/alerts for a fleet over a time window.
  x-realizes-capability-ids:
  - BC-2430.40
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-2430.40
      capability_name: Fleet Telematics and Monitoring
      spec: revvo-fleet-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: authApi
  url: ../openapi/revvo-auth-api-openapi.yml
  type: openapi
- name: eventApi
  url: ../openapi/revvo-event-api-openapi.yml
  type: openapi
- name: fleetApi
  url: ../openapi/revvo-fleet-api-openapi.yml
  type: openapi
workflows:
- workflowId: pullTireEvents
  summary: Get a JWT, then list tire events between two timestamps.
  inputs:
    type: object
    properties:
      apiKey: {type: string}
      fleetId: {type: string}
      fromTimestamp: {type: string}
      toTimestamp: {type: string}
  steps:
  - stepId: authenticate
    operationId: authToken
    parameters:
    - name: X-API-KEY
      in: header
      value: $inputs.apiKey
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      token: $response.body
  - stepId: getFleetStatus
    operationId: getFleetStatus
    parameters:
    - name: fleetId
      in: path
      value: $inputs.fleetId
    successCriteria:
    - condition: $statusCode == 200
  - stepId: listEvents
    operationId: getEvents
    parameters:
    - name: fleetId
      in: path
      value: $inputs.fleetId
    - name: fromTimestamp
      in: query
      value: $inputs.fromTimestamp
    - name: toTimestamp
      in: query
      value: $inputs.toTimestamp
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      events: $response.body
