aid: revvo
name: Revvo
description: >-
  Revvo is an AI-powered tire and fleet management platform. Its TireIQ engine
  connects to OEM and aftermarket TPMS sensors and turns raw tire data into
  real-time pressure, temperature, tread-wear, puncture and vehicle-off alerts
  delivered by SMS, email or API. The Revvo API is a v0 REST interface that lets
  fleets register gateways and sensors, manage vehicles and tires, and pull tire
  events, all scoped to a fleet. Authentication is a two-step exchange: a fleet
  API key is presented to POST /auth to mint a short-lived JWT, which is then
  sent as a bearer token on every operation. Revvo integrates with Geotab,
  Samsara, Motive, Fleetio, Lytx, Azuga and Zapier, and serves fleets across
  logistics, waste, food and beverage, oil and gas, and passenger transit.
