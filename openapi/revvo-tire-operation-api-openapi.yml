openapi: 3.0.1
info:
  title: revvo-api Api-keys Tire Operation API
  version: '0.0'
  description: Api key management (requires admin access)
tags:
- name: Tire Operation
  description: The Tire Operation API
paths:
  /fleet/{fleetId}/vehicle/{assetId}/tire/measurement:
    post:
      tags:
      - Tire Operation
      summary: Record manual tire measurement(s) for a vehicle
      description: Record manual tire measurement(s) for a vehicle
      operationId: recordTireMeasurement
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX. This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: assetId
        in: path
        description: Vehicle asset identifier
        required: true
        schema:
          type: string
      requestBody:
        description: 'Tire measurement details: position to tread depth in mm and optional tire casing id, etc'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TireMeasurementBody'
      responses:
        '200':
          description: Tire measurement(s) recorded successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generic400Response'
        '404':
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehicle404Response'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle/{assetId}/tire/replace:
    post:
      tags:
      - Tire Operation
      summary: Replace tire(s) on a vehicle
      description: Replace one or more tires on a vehicle
      operationId: replaceTire
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX. This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: assetId
        in: path
        description: Vehicle asset identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Tire replacement details per tire position
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TireReplacementBody'
      responses:
        '200':
          description: Tire(s) replaced successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generic400Response'
        '404':
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehicle404Response'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
components:
  schemas:
    Generic400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: '#/components/schemas/InternalErrorCode'
        success:
          type: boolean
          description: 'false'
          nullable: true
          example: false
      description: Generic400Response
    TireReplacementDetails:
      required:
      - tireTemplate
      type: object
      properties:
        tireTemplate:
          description: Tire template to replace the tire with
          allOf:
          - $ref: '#/components/schemas/tireTemplate'
      description: TireReplacementDetails Details for a single tire replacement, including the template to replace it with.
    GetVehicle404Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: '#/components/schemas/InternalErrorCode'
        success:
          type: boolean
          description: 'false'
          nullable: true
          example: false
      description: GetVehicle404Response
    TireReplacementBody:
      required:
