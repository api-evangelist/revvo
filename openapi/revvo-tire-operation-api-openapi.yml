      description: 'TireMeasurementBody Request body for recording manual tire measurements: a map from tire position to measurement details.'
    tireTemplate:
      required:
      - maxColdInflationPressureInPsi
      - maxTreadDepth32nds
      - tireBrand
      - tireModel
      - tireSizeCode
      type: object
      properties:
        tireBrand:
          type: string
          description: Tire Brand
          example: Hankook
        tireModel:
          type: string
          description: Tire Model
          example: Dynapro AT2 Xtreme RF12
        tireSizeCode:
          type: string
          description: Tire Size Code
          example: 215/65Rr17
        maxColdInflationPressureInPsi:
          type: number
          description: Max cold inflation pressure for tire
          format: double
          example: 120
        maxTreadDepth32nds:
          type: number
          description: Tread depth in 32nds from factory
          format: double
          example: 18
      description: Tire template to replace the tire with
    InternalErrorCode:
      type: string
      description: Internal Error Code
      enum:
      - _1
      - _2
      - _3
      - _4
      x-type: String
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
