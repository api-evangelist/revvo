openapi: 3.2.0
info:
  title: revvo-api Vehicle API
  version: '0.0'
  description: The Vehicle API
tags:
- name: Vehicle
  description: The Vehicle API
paths:
  /fleet/{fleetId}/vehicle:
    put:
      tags:
      - Vehicle
      summary: Update an existing vehicle
      operationId: updateVehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX. This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Vehicle to update with details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleBody'
      responses:
        '200':
          description: Vehicle updated successfully
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehicle404Response'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
    post:
      tags:
      - Vehicle
      summary: Create new vehicle
      operationId: vehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX. This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Vehicle details to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleBody'
      responses:
        '201':
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVehicle201Response'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVehicle400Response'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle/{vin}:
    get:
      tags:
      - Vehicle
      summary: Get details of a specific vehicle
      operationId: getVehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX. This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: vin
        in: path
        description: Vehicle identification number
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehicle200Response'
        '404':
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehicle404Response'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
components:
  schemas:
    GetVehicle404Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: '#/components/schemas/InternalErrorCode'
        success:
          type:
          - boolean
          - 'null'
          description: 'false'
          example: false
      description: GetVehicle404Response
    treadClass:
      type: string
      description: Tread class
      enum:
      - CRITICAL_LOW
      - LOW
      - MEDIUM
      - HIGH
      - UNKNOWN
      x-type: String
    GetVehicle200Response:
      type: object
      properties:
        value:
          description: Get value
          allOf:
          - $ref: '#/components/schemas/value'
        success:
          type: boolean
          description: 'true'
          example: true
      description: GetVehicle200Response
    value:
      type: object
      properties:
        vin:
          type:
          - string
          - 'null'
          description: VIN
          example: WVGBV75N19W507096
        assetId:
          type:
          - string
          - 'null'
          description: Vehicle asset identifier
          example: Vehicle 1
        geolocation:
          description: Get geolocation
          allOf:
          - $ref: '#/components/schemas/geolocation'
        tires:
          type:
          - array
          - 'null'
          description: Get tires
          items:
            $ref: '#/components/schemas/TireStatusListInner'
      description: VehicleStatus
    gatewayLocation:
      type: string
      description: Location of the gateway installation
      example: TRUCK_FRONT_LEFT_UNDER_DASHBOARD
      enum:
      - TRUCK_FRONT_LEFT_UNDER_DASHBOARD
      - TRUCK_FRONT_CENTER_UNDER_DASHBOARD
      - TRUCK_FRONT_RIGHT_UNDER_DASHBOARD
      - TRUCK_FRONT_LEFT_BEHIND_DRIVER_SEAT
      - TRUCK_FRONT_RIGHT_BEHIND_DRIVER_SEAT
      - CAR_FRONT_LEFT_OBD2
      - CAR_FRONT_CENTER_OBD2
      - CAR_FRONT_RIGHT_OBD2
      - CAR_REAR_LEFT_TRUNK
      - CAR_REAR_CENTER_TRUNK
      - CAR_REAR_RIGHT_TRUNK
      - TRAILER_FRONT_LEFT_TOP
      - TRAILER_FRONT_CENTER_TOP
      - TRAILER_FRONT_RIGHT_TOP
      - TRAILER_REAR_LEFT_TOP
      - TRAILER_REAR_CENTER_TOP
      - TRAILER_REAR_RIGHT_TOP
      - TRAILER_MIDDLE_LEFT_UNDERSIDE
      - TRAILER_MIDDLE_CENTER_UNDERSIDE
      - TRAILER_MIDDLE_RIGHT_UNDERSIDE
      - TRAILER_REAR_LEFT_UNDERSIDE
      - TRAILER_REAR_CENTER_UNDERSIDE
      - TRAILER_REAR_RIGHT_UNDERSIDE
      - TRUCK_LEFT_SLEEPER_BERTH
      - TRUCK_CENTER_SLEEPER_BERTH
      - TRUCK_RIGHT_SLEEPER_BERTH
    displayType:
      type: string
      description: Vehicle Display Type
      example: TRACTOR_2_4
      enum:
      - CAR
      - VAN
      - TRUCK
      - SUV
      - CARGO_VAN
      - LOADER
      - TRACTOR
      - TRACTOR_2_2
      - TRACTOR_2_4
      - TRACTOR_2_2_2
      - TRAILER
      - TANKER
      - DRY_VAN
      - REEFER
      - CONTAINER
      - BUS
      - REFUSE_TRUCK
      - FRONT_LOADER_WASTE_TRUCK
      - SIDE_LOADER_WASTE_TRUCK
      - BOX_TRUCK
      - BOX_TRUCK_BLUE
      - AMBULANCE
      - FIRE_TRUCK
      - VAN_BLUE
      - DUMP_TRUCK
    CreateVehicle201Response:
      required:
      - value
      type: object
      properties:
        value:
          type: string
          description: Get value
        success:
          type: boolean
          description: 'true'
          example: true
      description: CreateVehicle201Response
    type:
      type: string
      description: Event type
      enum:
      - LOW_PRESSURE
      - CRITICAL_LOW_PRESSURE
      - LOW_PRESSURE_IN_MOTION
      - CRITICAL_LOW_PRESSURE_IN_MOTION
      - LOW_TREAD
      - CRITICAL_LOW_TREAD
      - LOW_PRESSURE_FROM_TEMP
      - INVALID_SENSOR_DATA
      - DEFLATED
      - LEAK
      - HIGH_TEMPERATURE
      - HIGH_PRESSURE
      - SUSPECTED_SERVICE_FROM_DEFLATION
      - SUSPECTED_TIRE_ROTATION
      x-type: String
    TireStatusListInner:
      type: object
      properties:
        timestamp:
          type:
          - integer
          - 'null'
          description: Timestamp in epoch seconds
          format: int64
          example: 1577836800
        tirePosition:
          description: Get tirePosition
          allOf:
          - $ref: '#/components/schemas/tirePosition_1'
        sensorId:
          type:
          - string
          - 'null'
          description: Get sensorId
        pressure:
          type:
          - number
          - 'null'
          description: Pressure in PSI
          example: 31.5
        temperature:
          type:
          - number
          - 'null'
          description: Temperature in Celsius
          example: 27.2
        treadClass:
          description: Get treadClass
          allOf:
          - $ref: '#/components/schemas/treadClass'
        treadInMm:
          type:
          - number
          - 'null'
          format: double
        tireTotalKm:
          type:
          - number
          - 'null'
          format: double
        openEvents:
          type:
          - array
          - 'null'
          description: Get openEvents
          items:
            $ref: '#/components/schemas/EventListInner'
        resolvedEvents:
          type:
          - array
          - 'null'
          description: Get resolvedEvents
          items:
            $ref: '#/components/schemas/EventListInner'
      description: TireStatusListInner
    CreateVehicleBody:
      required:
      - assetId
      - template
      type: object
      properties:
        vin:
          type:
          - string
          - 'null'
          description: VIN
          example: WVGBV75N19W507096
        assetId:
          type:
          - string
          - 'null'
          description: Vehicle asset identifier
          example: Vehicle 1
        template:
          description: Template details of the vehicle
          allOf:
          - $ref: '#/components/schemas/template'
      description: CreateVehicleBody
    AxleTypeApiModel:
      type: string
      enum:
      - STEER
      - DRIVE
      - TRAILER
      - RAISED
      - DEAD
    tireTemplate:
      required:
      - maxColdInflationPressureInPsi
      - maxTreadDepth32nds
      - tireBrand
      - tireModel
      - tireSizeCode
      type: object
      properties:
        tireBrand:
          type: string
          description: Tire Brand
          example: Hankook
        tireModel:
          type: string
          description: Tire Model
          example: Dynapro AT2 Xtreme RF12
        tireSizeCode:
          type: string
          description: Tire Size Code
          example: 215/65Rr17
        maxColdInflationPressureInPsi:
          type: number
          description: Max cold inflation pressure for tire
          format: double
          example: 120
        maxTreadDepth32nds:
          type: number
          description: Tread depth in 32nds from factory
          format: double
          example: 18
      description: Tire template to replace the tire with
    fuelType:
      type: string
      description: Vehicle Fuel Type
      example: GASOLINE
      enum:
      - CNG
      - DIESEL
      - ELECTRIC
      - ETHANOL
      - HYDROGEN
      - GASOLINE
      - NATURAL_GAS
      - PROPANE
      - NONE
    geolocation:
      type: object
      properties:
        timestamp:
          type:
          - integer
          - 'null'
          description: Timestamp in epoch seconds
          format: int64
          example: 1577836800
        latitude:
          type:
          - number
          - 'null'
          description: Latitude
          example: 37.5550874
        longitude:
          type:
          - number
          - 'null'
          description: Longitude
          example: -122.3000345
      description: Geolocation
