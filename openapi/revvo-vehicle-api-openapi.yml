    EventListInner:
      type: object
      properties:
        vin:
          type:
          - string
          - 'null'
          description: VIN
          example: WVGBV75N19W507096
        tirePosition:
          allOf:
          - $ref: '#/components/schemas/tirePosition_1'
        eventTime:
          type:
          - integer
          - 'null'
          description: Timestamp in epoch seconds
          format: int64
          example: 1577836800
        type:
          description: Get type
          allOf:
          - $ref: '#/components/schemas/type'
        resolutionTime:
          type:
          - integer
          - 'null'
          description: Timestamp in epoch seconds or null if the event is not resolved
          format: int64
          example: 1577836800
      description: EventListInner
    InternalErrorCode:
      type: string
      description: Internal Error Code
      enum:
      - _1
      - _2
      - _3
      - _4
      x-type: String
    template:
      required:
      - axleDetails
      - displayType
      - driveType
      - fuelType
      - gatewayLocation
      - make
      - model
      - tireCountByAxle
      - year
      type: object
      properties:
        tireCountByAxle:
          type: array
          description: Number of tires per axle in order
          example:
          - 2
          - 4
          items:
            type: integer
            format: int32
        axleDetails:
          type: array
          description: List of all detailed axle specifications
          items:
            $ref: '#/components/schemas/VehicleAxleDetails'
        make:
          type: string
          description: Vehicle Manufacturer
          example: Volvo
        model:
          type: string
          description: Vehicle Model
          example: VNL
        year:
          type: string
          description: Vehicle Manufacturing Year
          example: '2024'
        series:
          type:
          - string
          - 'null'
          description: Vehicle Series
          example: XC20
        driveType:
          type: string
          description: Drive Type
          example: 6x4
        displayType:
          description: Vehicle Display Type
          example: TRACTOR_2_4
          allOf:
          - $ref: '#/components/schemas/displayType'
        fuelType:
          description: Vehicle Fuel Type
          example: GASOLINE
          allOf:
          - $ref: '#/components/schemas/fuelType'
        gatewayLocation:
          description: Gateway Installation Locaton
          example: TRUCK_FRONT_LEFT_UNDER_DASHBOARD
          allOf:
          - $ref: '#/components/schemas/gatewayLocation'
        gvwr:
          type:
          - number
          - 'null'
          description: Gross Vehicle Weight Rating in Pounds
          format: double
          example: 9000
        overloadInLbs:
          type:
          - number
          - 'null'
          description: Gross Vehicle Weight Rating in Pounds
          format: double
          example: 9000
      description: Template details of the vehicle
    VehicleAxleDetails:
      required:
      - axleTypes
      - critHighPressurePercent
      - critLowPressurePercent
      - critLowTreadIn32nds
      - highPressurePercent
      - highTreadIn32nds
      - lowPressurePercent
      - lowTreadIn32nds
      - rcip
      - tireTemplate
      type: object
      properties:
        axleNumber:
          type:
          - integer
          - 'null'
          description: Axle number by canonical count. 1, 2, 3, and so on. Required except for super single axle.
          format: int32
          example: 1
        isSuperSingle:
          type:
          - boolean
          - 'null'
          description: Super Single Axle Details. Can be applied to any axle number. axleNumber can be null.
          example: true
        axleTypes:
          type: array
          description: Axle type
          example:
          - RAISED
          items:
            $ref: '#/components/schemas/AxleTypeApiModel'
        critLowPressurePercent:
          type: number
          description: '% of RCIP for Critical Low Pressure Event'
          format: double
          example: 0.8
        lowPressurePercent:
          type: number
          description: '% of RCIP for Low Pressure Event'
          format: double
          example: 0.9
        rcip:
          type: number
          description: Recommended cold inflation pressure in PSI
          format: double
          example: 100
        highPressurePercent:
          type: number
          description: '% of RCIP for High Pressure Event'
          format: double
          example: 1.25
        critHighPressurePercent:
          type: number
          description: '% of RCIP for Ciritcal High Pressure Event'
          format: double
          example: 1.35
        critLowTreadIn32nds:
          type: number
          description: Threshold for Critical Low Tread Event in 32nds
          format: double
          example: 3
        lowTreadIn32nds:
          type: number
          description: Threshold for Low Tread Event in 32nds
          format: double
          example: 5
        highTreadIn32nds:
          type: number
          description: High Tread Classification Threshold in 32nds
          format: double
          example: 10
        gawr:
          type:
          - number
          - 'null'
          description: Gross Axle Weight Rating in Pounds
          format: double
          example: 4000
        overloadInLbs:
          type:
          - number
          - 'null'
          description: Axle Overload Event Threshold in Pounds
          format: double
          example: 8500
        tireTemplate:
          description: Tire details for axle
          allOf:
          - $ref: '#/components/schemas/tireTemplate'
      description: VehicleAxleDetails
    CreateVehicle400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: '#/components/schemas/InternalErrorCode'
        success:
          type:
          - boolean
          - 'null'
          description: 'false'
          example: false
      description: CreateVehicle400Response
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
