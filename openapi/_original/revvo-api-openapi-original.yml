      description: Request body for registering devices (gateway and/or sensors) to
        a vehicle in one call.
    RegisterGatewayBody:
      required:
      - assetId
      - gatewayLocation
      type: object
      properties:
        gatewayId:
          type: string
          description: ID of the gateway
          nullable: true
          example: T1161230000
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
          example: Vehicle 1
        gatewayLocation:
          description: Location of the gateway installation
          example: TRUCK_FRONT_LEFT_UNDER_DASHBOARD
          allOf:
          - $ref: "#/components/schemas/gatewayLocation"
      description: RegisterGatewayBody
    RegisterSensorBody:
      required:
      - assetId
      - tirePosition
      type: object
      properties:
        sensorId:
          type: string
          description: ID of the sensor
          nullable: true
          example: S102000ABCD
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
          example: Vehicle 1
        tirePosition:
          description: Tire position of sensor installation
          example: LEFT_1
          allOf:
          - $ref: "#/components/schemas/tirePosition"
      description: RegisterSensorBody
