    tireTemplate:
      required:
      - maxColdInflationPressureInPsi
      - maxTreadDepth32nds
      - tireBrand
      - tireModel
      - tireSizeCode
      type: object
      properties:
        tireBrand:
          type: string
          description: Tire Brand
          example: Hankook
        tireModel:
          type: string
          description: Tire Model
          example: Dynapro AT2 Xtreme RF12
        tireSizeCode:
          type: string
          description: Tire Size Code
          example: 215/65Rr17
        maxColdInflationPressureInPsi:
          type: number
          description: Max cold inflation pressure for tire
          format: double
          example: 120
        maxTreadDepth32nds:
          type: number
          description: Tread depth in 32nds from factory
          format: double
          example: 18
      description: Tire template to replace the tire with
    treadClass:
      type: string
      description: Tread class
      enum:
      - CRITICAL_LOW
      - LOW
      - MEDIUM
      - HIGH
      - UNKNOWN
      x-type: String
    type:
      type: string
      description: Event type
      enum:
      - LOW_PRESSURE
      - CRITICAL_LOW_PRESSURE
      - LOW_PRESSURE_IN_MOTION
      - CRITICAL_LOW_PRESSURE_IN_MOTION
      - LOW_TREAD
      - CRITICAL_LOW_TREAD
      - LOW_PRESSURE_FROM_TEMP
      - INVALID_SENSOR_DATA
      - DEFLATED
      - LEAK
      - HIGH_TEMPERATURE
      - HIGH_PRESSURE
      - SUSPECTED_SERVICE_FROM_DEFLATION
      - SUSPECTED_TIRE_ROTATION
      x-type: String
    value:
      type: object
      properties:
        vin:
          type: string
          description: VIN
          nullable: true
          example: WVGBV75N19W507096
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
          example: Vehicle 1
        geolocation:
          description: Get geolocation
          nullable: true
          allOf:
          - $ref: "#/components/schemas/geolocation"
        tires:
          type: array
          description: Get tires
          nullable: true
          items:
            $ref: "#/components/schemas/TireStatusListInner"
      description: VehicleStatus
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
