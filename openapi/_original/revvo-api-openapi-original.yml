    TireReplacementDetails:
      required:
      - tireTemplate
      type: object
      properties:
        tireTemplate:
          description: Tire template to replace the tire with
          allOf:
          - $ref: "#/components/schemas/tireTemplate"
      description: "TireReplacementDetails Details for a single tire replacement,\
        \ including the template to replace it with."
    TireStatusListInner:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp in epoch seconds
          format: int64
          nullable: true
          example: 1577836800
        tirePosition:
          description: Get tirePosition
          nullable: true
          allOf:
          - $ref: "#/components/schemas/tirePosition_1"
        sensorId:
          type: string
          description: Get sensorId
          nullable: true
        pressure:
          type: number
          description: Pressure in PSI
          nullable: true
          example: 31.5
        temperature:
          type: number
          description: Temperature in Celsius
          nullable: true
          example: 27.2
        treadClass:
          description: Get treadClass
          nullable: true
          allOf:
          - $ref: "#/components/schemas/treadClass"
        treadInMm:
          type: number
          format: double
          nullable: true
        tireTotalKm:
          type: number
          format: double
          nullable: true
        openEvents:
          type: array
          description: Get openEvents
          nullable: true
          items:
            $ref: "#/components/schemas/EventListInner"
        resolvedEvents:
          type: array
          description: Get resolvedEvents
          nullable: true
          items:
            $ref: "#/components/schemas/EventListInner"
      description: TireStatusListInner
    VehicleAxleDetails:
      required:
      - axleTypes
      - critHighPressurePercent
      - critLowPressurePercent
      - critLowTreadIn32nds
      - highPressurePercent
      - highTreadIn32nds
      - lowPressurePercent
      - lowTreadIn32nds
      - rcip
      - tireTemplate
      type: object
      properties:
        axleNumber:
          type: integer
          description: "Axle number by canonical count. 1, 2, 3, and so on. Required\
            \ except for super single axle."
          format: int32
          nullable: true
          example: 1
        isSuperSingle:
          type: boolean
          description: Super Single Axle Details. Can be applied to any axle number.
            axleNumber can be null.
          nullable: true
          example: true
        axleTypes:
          type: array
          description: Axle type
          example:
          - RAISED
          items:
            $ref: "#/components/schemas/AxleTypeApiModel"
        critLowPressurePercent:
          type: number
          description: '% of RCIP for Critical Low Pressure Event'
          format: double
          example: 0.8
        lowPressurePercent:
          type: number
          description: '% of RCIP for Low Pressure Event'
          format: double
          example: 0.9
        rcip:
          type: number
          description: Recommended cold inflation pressure in PSI
          format: double
          example: 100
        highPressurePercent:
          type: number
          description: '% of RCIP for High Pressure Event'
          format: double
          example: 1.25
        critHighPressurePercent:
          type: number
          description: '% of RCIP for Ciritcal High Pressure Event'
          format: double
          example: 1.35
        critLowTreadIn32nds:
          type: number
          description: Threshold for Critical Low Tread Event in 32nds
          format: double
          example: 3
        lowTreadIn32nds:
          type: number
          description: Threshold for Low Tread Event in 32nds
          format: double
          example: 5
        highTreadIn32nds:
          type: number
          description: High Tread Classification Threshold in 32nds
          format: double
          example: 10
        gawr:
          type: number
          description: Gross Axle Weight Rating in Pounds
          format: double
          nullable: true
          example: 4000
        overloadInLbs:
          type: number
          description: Axle Overload Event Threshold in Pounds
          format: double
          nullable: true
          example: 8500
        tireTemplate:
          description: Tire details for axle
          allOf:
          - $ref: "#/components/schemas/tireTemplate"
      description: VehicleAxleDetails
    VehicleStatus:
      type: object
      properties:
        vin:
          type: string
          description: VIN
          nullable: true
          example: WVGBV75N19W507096
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
          example: Vehicle 1
        geolocation:
          description: Get geolocation
          nullable: true
          allOf:
          - $ref: "#/components/schemas/geolocation"
