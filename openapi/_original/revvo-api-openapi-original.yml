openapi: 3.0.1
info:
  title: revvo-api
  version: "0.0"
tags:
- name: Api-keys
  description: Api key management (requires admin access)
- name: Auth
  description: Get authorization token using an API key
- name: Device
  description: The Device API
- name: Event
  description: The Event API
- name: Fleet
  description: The Fleet API
- name: Tire Operation
  description: The Tire Operation API
- name: Vehicle
  description: The Vehicle API
paths:
  /api-keys/fleet/{fleetId}:
    get:
      tags:
      - Api-keys
      summary: Get details of existing API keys
      description: List all existing API keys
      operationId: getApiKeys
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetApiKey200Response"
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
    put:
      tags:
      - Api-keys
      summary: Creates a new API key
      description: Creates a new API key
      operationId: addApiKey
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      responses:
        "200":
          description: the generated API key
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /api-keys/fleet/{fleetId}/key-id/{keyId}:
    delete:
      tags:
      - Api-keys
      summary: Delete an existing API key
      description: Delete an existing API key
      operationId: deleteApiKey
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: keyId
        in: path
        description: "Key id to delete, must be one of the values returned bu the\
          \ get method"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteApiKey 200 response
      security:
      - bearerAuth: []
  /auth:
    post:
      tags:
      - Auth
      summary: Get a JWT authentication token
      operationId: authToken
      parameters:
      - name: X-API-KEY
        in: header
        description: Supplied API key
        required: true
      responses:
        "200":
          description: A JWT token to use in the other endpoints
          content:
            text/plain: {}
        "401":
          description: Unauthorized
  /fleet/{fleetId}:
    get:
      tags:
      - Fleet
      summary: Get details of all vehicles in the fleet
      description: Get details of all vehicles in the fleet
      operationId: getFleetStatus
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: timestamp
        in: query
        description: |
          Optionally retrieve fleet data at a given point in time. Point in time is expressed as seconds since epoch.
          This option depends on periodic snapshots of the fleet status being saved. Closest available snapshot within a 24h period of the target timestamp will be selected.
          An error will occur if no snapshot is available within that 24h period
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFleetStatus200Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/devices/register:
    post:
      tags:
      - Device
      summary: Register devices (gateway and/or sensors) to vehicle
      description: Register devices (gateway and/or sensors) to vehicle
      operationId: registerDevicesForVehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Register devices for vehicle details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDevicesForVehicleBody"
      responses:
        "200":
          description: Registered devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration200Response"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration400Response"
        "404":
          description: Device or Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/events:
    get:
      tags:
      - Event
      summary: Get all events between two dates (up to 5 days in the past)
      operationId: getEvents
      parameters:
      - name: fleetId
        in: path
        description: Fleet identifier
        required: true
      - name: fromTimestamp
        in: query
        description: Start Timestamp (epoch seconds) - Defaults to 5 days ago if not
          specified or an older date is provided
        required: false
      - name: toTimestamp
        in: query
        description: End Timestamp (epoch seconds) - Defaults to now if not specified
          or a future date is provided
        required: false
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents200Response"
        "400":
          description: Error processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEvents400Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/gateway/register:
    post:
      tags:
      - Device
      summary: Register gateway to vehicle
      description: Register gateway to vehicle
      operationId: registerGateway
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Register gateway details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterGatewayBody"
      responses:
        "200":
          description: Registered gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration200Response"
        "304":
          description: Registration was unsuccessful
          content:
            application/json: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration400Response"
        "404":
          description: Device or Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/sensor:
    get:
      tags:
      - Device
      summary: Get details about the sensor
      operationId: getSensor
      parameters:
      - name: fleetId
        in: path
        description: Fleet identifier
        required: true
      - name: externalId
        in: query
        description: External ID
        required: false
      - name: macAddress
        in: query
        description: MAC Address
        required: false
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDevices200Response"
        "400":
          description: Error processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDevices400Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/sensor/register:
    post:
      tags:
      - Device
      summary: Register sensor to vehicle tire
      description: Register sensor to vehicle tire
      operationId: registerSensor
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Register sensor details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSensorBody"
      responses:
        "200":
          description: Registered sensor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration200Response"
        "304":
          description: Registration was unsuccessful
          content:
            application/json: {}
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration400Response"
        "404":
          description: Device or Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistration404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle:
    put:
      tags:
      - Vehicle
      summary: Update an existing vehicle
      description: Update an existing vehicle
      operationId: updateVehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Vehicle to update with details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "200":
          description: Vehicle updated successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVehicle404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
    post:
      tags:
      - Vehicle
      summary: Create new vehicle
      description: Create new vehicle
      operationId: vehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      requestBody:
        description: Vehicle details to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVehicle201Response"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateVehicle400Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle/{assetId}/tire/measurement:
    post:
      tags:
      - Tire Operation
      summary: Record manual tire measurement(s) for a vehicle
      description: Record manual tire measurement(s) for a vehicle
      operationId: recordTireMeasurement
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: assetId
        in: path
        description: Vehicle asset identifier
        required: true
        schema:
          type: string
      requestBody:
        description: "Tire measurement details: position to tread depth in mm and\
          \ optional tire casing id, etc"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TireMeasurementBody"
      responses:
        "200":
          description: Tire measurement(s) recorded successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generic400Response"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVehicle404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle/{assetId}/tire/replace:
    post:
      tags:
      - Tire Operation
      summary: Replace tire(s) on a vehicle
      description: Replace one or more tires on a vehicle
      operationId: replaceTire
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: assetId
        in: path
        description: Vehicle asset identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Tire replacement details per tire position
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TireReplacementBody"
      responses:
        "200":
          description: Tire(s) replaced successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generic400Response"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVehicle404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
  /fleet/{fleetId}/vehicle/{vin}:
    get:
      tags:
      - Vehicle
      summary: Get details of a specific vehicle
      description: Get details of a specific vehicle
      operationId: getVehicle
      parameters:
      - name: fleetId
        in: path
        description: Unique identifier for the fleet. Typically formatted as revvo-XXXX.
          This can be found in your admin / integrations / revvo API setup page
        required: true
        schema:
          type: string
      - name: vin
        in: path
        description: Vehicle identification number
        required: true
        schema:
          type: string
      responses:
        "200":
          description: A successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVehicle200Response"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVehicle404Response"
        "401":
          description: Unauthorized
      security:
      - Bearer: []
      - bearerAuth: []
components:
  schemas:
    ApiKeyData:
      required:
      - creationTimestamp
      - expirationTimestamp
      - keyId
      type: object
      properties:
        keyId:
          type: string
        creationTimestamp:
          type: integer
          format: int64
        expirationTimestamp:
          type: integer
          format: int64
    AxleTypeApiModel:
      type: string
      enum:
      - STEER
      - DRIVE
      - TRAILER
      - RAISED
      - DEAD
    CreateVehicle201Response:
      required:
      - value
      type: object
      properties:
        value:
          type: string
          description: Get value
        success:
          type: boolean
          description: "true"
          example: true
      description: CreateVehicle201Response
    CreateVehicle400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
      description: CreateVehicle400Response
    CreateVehicleBody:
      required:
      - assetId
      - template
      type: object
      properties:
        vin:
          type: string
          description: VIN
          nullable: true
          example: WVGBV75N19W507096
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
          example: Vehicle 1
        template:
          description: Template details of the vehicle
          allOf:
          - $ref: "#/components/schemas/template"
      description: CreateVehicleBody
    Device:
      type: object
      properties:
        externalId:
          type: string
          description: Device's External ID
          nullable: true
          example: 111000ABCD
        macAddress:
          type: string
          description: MAC Address
          nullable: true
          example: DE:AD:BE:EF:00:00
      description: Device
    DeviceRegistration200Response:
      required:
      - value
      type: object
      properties:
        value:
          type: string
          description: Get value
        success:
          type: boolean
          description: "true"
          example: true
      description: DeviceRegistration200Response
    DeviceRegistration400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
      description: DeviceRegistration400Response
    DeviceRegistration404Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
      description: DeviceRegistration404Response
    EventListInner:
      type: object
      properties:
        vin:
          type: string
          description: VIN
          nullable: true
          example: WVGBV75N19W507096
        tirePosition:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/tirePosition_1"
        eventTime:
          type: integer
          description: Timestamp in epoch seconds
          format: int64
          nullable: true
          example: 1577836800
        type:
          description: Get type
          nullable: true
          allOf:
          - $ref: "#/components/schemas/type"
        resolutionTime:
          type: integer
          description: Timestamp in epoch seconds or null if the event is not resolved
          format: int64
          nullable: true
          example: 1577836800
      description: EventListInner
    Generic400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
      description: Generic400Response
    GetApiKey200Response:
      required:
      - value
      type: object
      properties:
        value:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyData"
    GetDevices200Response:
      type: object
      properties:
        value:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Device"
        success:
          type: boolean
          description: "true"
          example: true
    GetDevices400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
    GetEvents200Response:
      type: object
      properties:
        value:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/EventListInner"
        success:
          type: boolean
          description: "true"
          example: true
    GetEvents400Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
    GetFleetStatus200Response:
      type: object
      properties:
        value:
          type: array
          description: Get value
          nullable: true
          items:
            $ref: "#/components/schemas/VehicleStatus"
        valueTimestamp:
          type: integer
          description: The actual timestamp of the data returned in the value property
            (as seconds since epoch)
          format: int64
          nullable: true
        displayErrorMessage:
          type: string
          description: Get displayErrorMessage
          nullable: true
          example: Error contacting servers. Please try again later.
        internalErrorMessage:
          type: string
          description: Get internalErrorMessage
          nullable: true
          example: "Failed loading tires, please contact the server team."
        internalErrorCode:
          description: Get internalErrorCode
          nullable: true
          allOf:
          - $ref: "#/components/schemas/internalErrorCode"
        success:
          type: boolean
          description: "true"
          example: true
      description: GetFleetStatus200Response
    GetVehicle200Response:
      type: object
      properties:
        value:
          description: Get value
          nullable: true
          allOf:
          - $ref: "#/components/schemas/value"
        success:
          type: boolean
          description: "true"
          example: true
      description: GetVehicle200Response
    GetVehicle404Response:
      type: object
      properties:
        displayErrorMessage:
          type: string
          example: Unexpected error found
        internalErrorCode:
          $ref: "#/components/schemas/InternalErrorCode"
        success:
          type: boolean
          description: "false"
          nullable: true
          example: false
      description: GetVehicle404Response
    InternalErrorCode:
      type: string
      description: Internal Error Code
      enum:
      - _1
      - _2
      - _3
      - _4
      x-type: String
    RegisterDevicesForVehicleBody:
      required:
      - assetId
      type: object
      properties:
        assetId:
          type: string
          description: Vehicle asset identifier
          nullable: true
        gatewayMacAddress:
          type: string
          description: "Optional gateway MAC address; if provided, gatewayInstallLocation\
            \ is required"
          nullable: true
        gatewayInstallLocation:
          description: Install location for the gateway; required when gatewayMacAddress
            is provided
          nullable: true
          allOf:
          - $ref: "#/components/schemas/gatewayInstallLocation"
        tirePositionToSensorMacAddress:
          type: object
          description: "Map of tire position (e.g. LEFT_1, RIGHT_1) to sensor MAC\
            \ address; all positions must exist on the vehicle"
          nullable: true
          allOf:
          - type: object
            properties:
              FRONT_LEFT:
                type: string
              FRONT_RIGHT:
                type: string
              REAR_LEFT:
                type: string
              REAR_RIGHT:
                type: string
              EXTERNAL:
                type: string
              OBD2:
                type: string
              DEVICE:
                type: string
              UNKNOWN:
                type: string
              FRONT:
                type: string
              REAR:
                type: string
              LEFT_1:
                type: string
              LEFT_1_OUTER:
                type: string
              LEFT_1_INNER:
                type: string
              RIGHT_1:
                type: string
              RIGHT_1_INNER:
                type: string
              RIGHT_1_OUTER:
                type: string
              LEFT_2:
                type: string
              LEFT_2_OUTER:
                type: string
              LEFT_2_INNER:
                type: string
              RIGHT_2:
                type: string
              RIGHT_2_INNER:
                type: string
              RIGHT_2_OUTER:
                type: string
              LEFT_3:
                type: string
              LEFT_3_OUTER:
                type: string
              LEFT_3_INNER:
                type: string
              RIGHT_3:
                type: string
              RIGHT_3_INNER:
                type: string
              RIGHT_3_OUTER:
                type: string
              LEFT_4:
                type: string
              LEFT_4_OUTER:
                type: string
              LEFT_4_INNER:
                type: string
              RIGHT_4:
                type: string
              RIGHT_4_INNER:
                type: string
              RIGHT_4_OUTER:
                type: string
              LEFT_5:
                type: string
              LEFT_5_OUTER:
                type: string
              LEFT_5_INNER:
                type: string
              RIGHT_5:
                type: string
              RIGHT_5_INNER:
                type: string
              RIGHT_5_OUTER:
                type: string
              LEFT_6:
                type: string
              LEFT_6_OUTER:
                type: string
              LEFT_6_INNER:
                type: string
              RIGHT_6:
                type: string
              RIGHT_6_INNER:
                type: string
              RIGHT_6_OUTER:
                type: string
              LEFT_7:
                type: string
              LEFT_7_OUTER:
                type: string
              LEFT_7_INNER:
                type: string
              RIGHT_7:
                type: string
              RIGHT_7_INNER:
                type: string
              RIGHT_7_OUTER:
                type: string
              LEFT_8:
                type: string
              LEFT_8_OUTER:
                type: string
              LEFT_8_INNER:
                type: string
              RIGHT_8:
                type: string
              RIGHT_8_INNER:
                type: string
              RIGHT_8_OUTER:
                type: string
              LEFT_9:
                type: string
