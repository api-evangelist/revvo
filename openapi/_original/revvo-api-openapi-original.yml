    geolocation:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp in epoch seconds
          format: int64
          nullable: true
          example: 1577836800
        latitude:
          type: number
          description: Latitude
          nullable: true
          example: 37.5550874
        longitude:
          type: number
          description: Longitude
          nullable: true
          example: -122.3000345
      description: Geolocation
    internalErrorCode:
      type: string
      description: Internal Error Code
      enum:
      - _1
      - _2
      - _3
      - _4
      x-type: String
    template:
      required:
      - axleDetails
      - displayType
      - driveType
      - fuelType
      - gatewayLocation
      - make
      - model
      - tireCountByAxle
      - year
      type: object
      properties:
        tireCountByAxle:
          type: array
          description: Number of tires per axle in order
          example:
          - 2
          - 4
          items:
            type: integer
            format: int32
        axleDetails:
          type: array
          description: List of all detailed axle specifications
          items:
            $ref: "#/components/schemas/VehicleAxleDetails"
        make:
          type: string
          description: Vehicle Manufacturer
          example: Volvo
        model:
          type: string
          description: Vehicle Model
          example: VNL
        year:
          type: string
          description: Vehicle Manufacturing Year
          example: "2024"
        series:
          type: string
          description: Vehicle Series
          nullable: true
          example: XC20
        driveType:
          type: string
          description: Drive Type
          example: 6x4
        displayType:
          description: Vehicle Display Type
          example: TRACTOR_2_4
          allOf:
          - $ref: "#/components/schemas/displayType"
        fuelType:
          description: Vehicle Fuel Type
          example: GASOLINE
          allOf:
          - $ref: "#/components/schemas/fuelType"
        gatewayLocation:
          description: Gateway Installation Locaton
          nullable: true
          example: TRUCK_FRONT_LEFT_UNDER_DASHBOARD
          allOf:
          - $ref: "#/components/schemas/gatewayLocation"
        gvwr:
          type: number
          description: Gross Vehicle Weight Rating in Pounds
          format: double
          nullable: true
          example: 9000
        overloadInLbs:
          type: number
          description: Gross Vehicle Weight Rating in Pounds
          format: double
          nullable: true
          example: 9000
      description: Template details of the vehicle
