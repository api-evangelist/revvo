openapi: 3.2.0
info:
  title: revvo-api Auth API
  version: '0.0'
  description: Get authorization token using an API key
tags:
- name: Auth
  description: Get authorization token using an API key
paths:
  /auth:
    post:
      tags:
      - Auth
      summary: Get a JWT authentication token
      operationId: authToken
      parameters:
      - name: X-API-KEY
        in: header
        description: Supplied API key
        required: true
      responses:
        '200':
          description: A JWT token to use in the other endpoints
          content:
            text/plain: {}
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Revvo
  source: https://api.revvo.ai/swagger/revvo-api-0.0.yml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
